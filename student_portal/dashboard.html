<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color: rgb(245, 232, 232);">

<div class="container mt-4">

    <!-- PAGE TITLE -->
    <h2 class="mb-4 text-center ">Student Dashboard</h2>

    <!-- STATISTICS CARDS -->
    <div class="row g-4 mb-4">

        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card text-bg-primary text-center shadow">
                <div class="card-body">
                    <h5>Total Students</h5>
                    <h2>500</h2>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card text-bg-success text-center shadow">
                <div class="card-body">
                    <h5>Present Students</h5>
                    <h2>450</h2>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card text-bg-danger text-center shadow">
                <div class="card-body">
                    <h5>Absent Students</h5>
                    <h2>50</h2>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card text-bg-warning text-center shadow">
                <div class="card-body">
                    <h5>Placements</h5>
                    <h2>120</h2>
                </div>
            </div>
        </div>

    </div>

    <!-- SEARCH BOX -->
    <div class="row mb-3">
        <div class="col-md-6 offset-md-3">
            <input type="text" class="form-control" placeholder="Search student...">
        </div>
    </div>

    <!-- STUDENT TABLE -->
    <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover text-center">

            <thead class="table-dark">
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Branch</th>
                    <th>Attendance</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>101</td>
                    <td>Rahul</td>
                    <td>CSE</td>
                    <td><span class="badge bg-success">Present</span></td>
                </tr>

                <tr>
                    <td>102</td>
                    <td>Priya</td>
                    <td>ECE</td>
                    <td><span class="badge bg-danger">Absent</span></td>
                </tr>

                <tr>
                    <td>103</td>
                    <td>Arjun</td>
                    <td>EEE</td>
                    <td><span class="badge bg-success">Present</span></td>
                </tr>

                <tr>
                    <td>104</td>
                    <td>Meena</td>
                    <td>Civil</td>
                    <td><span class="badge bg-success">Present</span></td>
                </tr>
            </tbody>

        </table>
    </div>
    <div class="d-flex justify-content-center ">
    <a href="portal.html" class="btn btn-danger w-25 ">Back</a>
    </div>

</div>

</body>
</html>
