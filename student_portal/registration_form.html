<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color: rgb(210, 221, 179);">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow p-4" style="background-color: rgb(233, 211, 186);">

                <h3 class="text-center mb-4">Student Registration Form</h3>

                <form class="needs-validation" action="profile.html" novalidate>

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" required>
                        <div class="invalid-feedback">Full Name is required</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Roll Number</label>
                        <input type="text" class="form-control" required>
                        <div class="invalid-feedback">Roll Number is required</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" required>
                        <div class="invalid-feedback">Enter valid email</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mobile Number</label>
                        <input type="tel" class="form-control" pattern="[0-9]{10}" required>
                        <div class="invalid-feedback">Enter 10 digit mobile number</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Gender</label>
                        <select class="form-select" required>
                            <option value="">Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                        <div class="invalid-feedback">Please select gender</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Branch</label>
                        <select class="form-select" required>
                            <option value="">Select Branch</option>
                            <option>CSE</option>
                            <option>ECE</option>
                            <option>EEE</option>
                            <option>Civil</option>
                            <option>Mechanical</option>
                        </select>
                        <div class="invalid-feedback">Please select branch</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" required>
                        <div class="invalid-feedback">DOB is required</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <textarea class="form-control" rows="3" required></textarea>
                        <div class="invalid-feedback">Address is required</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Upload Photo</label>
                        <input type="file" class="form-control" required>
                        <div class="invalid-feedback">Upload photo</div>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" required>
                        <label class="form-check-label">
                            I agree to the terms and conditions
                        </label>
                        <div class="invalid-feedback">
                            You must agree before submitting
                        </div>
                    </div>

                    <button class="btn btn-success w-50" type="submit">
                        Register
                    </button>
                    <a href="portal.html" class="btn btn-danger w-25" type="submit">
                        Back
                    </a>

                </form>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
(() => {
  'use strict'
  const forms = document.querySelectorAll('.needs-validation')

  Array.from(forms).forEach(form => {
    form.addEventListener('submit', event => {
      if (!form.checkValidity()) {
        event.preventDefault()
        event.stopPropagation()
      }
      form.classList.add('was-validated')
    }, false)
  })
})()
</script>

</body>
</html>
