
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color: #d9e4f5;
        }

        .registration-card{
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .header{
            background: linear-gradient(to right,#0d6efd,#0a58ca);
            color: white;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>Student Registration Form</h1>
        <p>Excel Institute of Technology & Management</p>
    </div>

    <div class="container my-5">

        <div class="card registration-card">

            <div class="card-body p-4">

                <h3 class="text-center mb-4">
                    Register for a Course
                </h3>

                <form id="registrationForm">

                    <!-- Student Name -->
                    <div class="mb-3">
                        <label class="form-label">
                            Student Name
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            placeholder="Enter your name"
                            required>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label">
                            Email
                        </label>
                        <input
                            type="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>
                    </div>

                    <!-- Mobile Number -->
                    <div class="mb-3">
                        <label class="form-label">
                            Mobile Number
                        </label>
                        <input
                            type="tel"
                            class="form-control"
                            placeholder="Enter mobile number"
                            required>
                    </div>

                    <!-- Gender -->
                    <div class="mb-3">
                        <label class="form-label d-block">
                            Gender
                        </label>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input"
                                   type="radio"
                                   name="gender"
                                   required>
                            <label class="form-check-label">
                                Male
                            </label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input"
                                   type="radio"
                                   name="gender">
                            <label class="form-check-label">
                                Female
                            </label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input"
                                   type="radio"
                                   name="gender">
                            <label class="form-check-label">
                                Other
                            </label>
                        </div>

                    </div>

                    <!-- Course Selection -->
                    <div class="mb-3">
                        <label class="form-label">
                            Course Selection
                        </label>

                        <select class="form-select" required>

                            <option value="">
                                Select Course
                            </option>

                            <option>
                                Web Development
                            </option>

                            <option>
                                Python Programming
                            </option>

                            <option>
                                Data Science
                            </option>

                            <option>
                                AI & Machine Learning
                            </option>

                            <option>
                                Java Programming
                            </option>

                            <option>
                                Cloud Computing
                            </option>

                        </select>
                    </div>

                    <!-- Qualification -->
                    <div class="mb-3">
                        <label class="form-label">
                            Qualification
                        </label>

                        <select class="form-select" required>
                            <option value="">
                                Select Qualification
                            </option>
                            <option>Intermediate</option>
                            <option>Diploma</option>
                            <option>B.Tech</option>
                            <option>B.Sc</option>
                            <option>MCA</option>
                            <option>M.Tech</option>
                        </select>
                    </div>

                    <!-- Address -->
                    <div class="mb-3">
                        <label class="form-label">
                            Address
                        </label>

                        <textarea
                            class="form-control"
                            rows="4"
                            placeholder="Enter your address"
                            required></textarea>
                    </div>

                    <!-- Upload Resume -->
                    <div class="mb-3">
                        <label class="form-label">
                            Upload Resume
                        </label>

                        <input
                            type="file"
                            class="form-control"
                            required>
                    </div>

                    <!-- Terms -->
                    <div class="form-check mb-4">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="terms"
                            required>

                        <label
                            class="form-check-label"
                            for="terms">

                            I agree to the Terms & Conditions

                        </label>

                    </div>

                    <!-- Submit Button -->
                    <div class="text-center">

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg">

                            Register Now

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <script>
        document
        .getElementById("registrationForm")
        .addEventListener("submit", function(event){

            event.preventDefault();

            alert("Registration Successful!");

            this.reset();
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
```
