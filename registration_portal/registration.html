<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Excel Institute</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #d9e4f5;
        }

        .portal-card {
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .header {
            background: linear-gradient(to right,#0d6efd,#0a58ca);
            color: white;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark " style="background-color: rgb(28, 28, 85);">
        <div class="container">

            <a class="navbar-brand" href="#">
                <img src="images/logo.png" alt="Logo" height="50">
                Excel Institute
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="home.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="courses.html">Courses</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="aboutus.html">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>
    <div class="header">
        <h1>Student Registration Form</h1>
        <p>Excel Institute of Technology & Management</p>
    </div>

    <div class="container my-5">

        <div class="card portal-card">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Register for a Course</h3>

                <form id="registrationForm">
                    <div class="mb-3">
                        <label class="form-label">Student Name</label>
                        <input type="text" id="regName" class="form-control" placeholder="Enter your name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="Enter your email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Create Password</label>
                        <input type="password" id="regPassword" class="form-control" placeholder="Create a password" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mobile Number</label>
                        <input type="tel" id="regMobile" class="form-control" placeholder="Enter mobile number" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label d-block">Gender</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" value="Male" required>
                            <label class="form-check-label">Male</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" value="Female">
                            <label class="form-check-label">Female</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" value="Other">
                            <label class="form-check-label">Other</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Course Selection</label>
                        <select id="regCourse" class="form-select" required>
                            <option value="">Select Course</option>
                            <option>Web Development</option>
                            <option>Python Programming</option>
                            <option>Data Science</option>
                            <option>AI & Machine Learning</option>
                            <option>Java Programming</option>
                            <option>Cloud Computing</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Qualification</label>
                        <select id="regQualification" class="form-select" required>
                            <option value="">Select Qualification</option>
                            <option>Intermediate</option>
                            <option>Diploma</option>
                            <option>B.Tech</option>
                            <option>B.Sc</option>
                            <option>MCA</option>
                            <option>M.Tech</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <textarea id="regAddress" class="form-control" rows="4" placeholder="Enter your address" required></textarea>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="terms" required>
                        <label class="form-check-label" for="terms">
                            I agree to the Terms & Conditions
                        </label>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Register Now</button>
                        <p class="mb-0">Already registered? <a href="login.html">Login Here</a></p>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script>
        document.getElementById("registrationForm").addEventListener("submit", function(event){
            event.preventDefault();

            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const name = document.getElementById('regName').value;
            const mobile = document.getElementById('regMobile').value;
            const gender = document.querySelector('input[name="gender"]:checked').value;
            const course = document.getElementById('regCourse').value;
            const qualification = document.getElementById('regQualification').value;
            const address = document.getElementById('regAddress').value;

            let currentStudents = JSON.parse(localStorage.getItem('registeredStudents')) || [];

            const userExists = currentStudents.some(student => student.email.toLowerCase() === email.toLowerCase());
            if(userExists) {
                alert("An account with this email has already registered!");
                return;
            }

            const studentData = {
                name: name,
                email: email,
                password: password,
                mobile: mobile,
                gender: gender,
                course: course,
                qualification: qualification,
                address: address,
                timestamp: new Date().toLocaleString()
            };

            currentStudents.push(studentData);
            localStorage.setItem('registeredStudents', JSON.stringify(currentStudents));

            alert("Registration Successful! Redirecting to the Login page...");
            this.reset();
            
            window.location.href = "login.html";
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
