<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Excel Institute</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #d9e4f5;
        }

        .portal-card {
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .header {
            background: linear-gradient(to right,#0d6efd,#0a58ca);
            color: white;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark " style="background-color: rgb(28, 28, 85);">
        <div class="container">

            <a class="navbar-brand" href="#">
                <img src="images/logo.png" alt="Logo" height="50">
                Excel Institute
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="home.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="courses.html">Courses</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="aboutus.html">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>
    <div class="header">
        <h1>Student Login</h1>
        <p>Excel Institute of Technology & Management</p>
    </div>

    <div class="container my-5">

        <div class="card portal-card mx-auto" style="max-width: 500px;">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Student Login</h3>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="loginEmail" class="form-control" placeholder="Enter registered email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Login</button>
                        <p class="mb-0">New Student? <a href="registration.html">Create an Account</a></p>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const emailInput = document.getElementById('loginEmail').value.trim();
            const passwordInput = document.getElementById('loginPassword').value;

            let currentStudents = JSON.parse(localStorage.getItem('registeredStudents')) || [];

            const validatedStudent = currentStudents.find(student => 
                student.email.toLowerCase() === emailInput.toLowerCase() && 
                student.password === passwordInput
            );

            if (validatedStudent) {
                alert(`Welcome back, ${validatedStudent.name}! Login successful for course: ${validatedStudent.course}.`);
                this.reset();
            } else {
                alert("Invalid email or password entry records. Try again.");
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
