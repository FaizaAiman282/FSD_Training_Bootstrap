<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:rgb(223, 223, 165);
        }

        .registration-card{
            max-width:700px;
            margin:auto;
            margin-top:50px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark  sticky-top" style="background-color:rgb(17, 22, 49)">
    <div class="container">
        <a class="navbar-brand fw-bold" href="home.html">
            College Events
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="home.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="events.html">Events</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="gallery.html">Gallery</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="registration.html">Registration</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Registration Form -->
<div class="container" >
    <div class="card shadow registration-card">
        <div class="card-header bg-success text-white text-center">
            <h3>Event Registration Form</h3>
        </div>

        <div class="card-body" style="background-color:rgb(240, 240, 236);">

            <!-- Success Message -->
            <div id="successMsg" class="alert alert-success d-none">
                Registration Successful! 
            </div>

            <form id="registrationForm">

                <div class="mb-3">
                    <label class="form-label" >Student Name</label>
                    <input type="text"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Roll Number</label>
                    <input type="text"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Branch</label>
                    <select class="form-select" required>
                        <option value="">Select Branch</option>
                        <option>CSE</option>
                        <option>ECE</option>
                        <option>EEE</option>
                        <option>Mechanical</option>
                        <option>Civil</option>
                        <option>IT</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mobile Number</label>
                    <input type="tel"
                           class="form-control"
                           pattern="[0-9]{10}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Event Selection</label>
                    <select class="form-select" required>
                        <option value="">Select Event</option>
                        <option>Technical Quiz</option>
                        <option>Hackathon</option>
                        <option>Poster Presentation</option>
                        <option>Coding Contest</option>
                        <option>Project Expo</option>
                        <option>Cultural Fest</option>
                    </select>
                </div>

                <a href="success.html"
                        class="btn btn-success w-100">
                    Register
            </a>

            </form>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">
        &copy; 2026 College Event Management System
    </p>
</footer>

<script>
document.getElementById("registrationForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    document.getElementById("successMsg")
            .classList.remove("d-none");

    this.reset();
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
